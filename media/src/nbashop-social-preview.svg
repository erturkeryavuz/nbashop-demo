        <text x="130" y="168" text-anchor="middle" fill="#F8FAFC" stroke="#18181B" stroke-width="2" font-family="-apple-system, sans-serif" font-weight="800" font-size="52">23</text>
      </g>
      <text x="14" y="196" fill="#F1EDE5" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Apex Crimson #23</text>
      <text x="14" y="222" fill="#D2BA98" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700">$119.00</text>
      <text x="242" y="222" text-anchor="end" fill="#758D92" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="600">34 IN STOCK</text>
