      <stop offset="0%" stop-color="#101113"/>
      <stop offset="56%" stop-color="#15161B"/>
      <stop offset="100%" stop-color="#211617"/>
    </linearGradient>
    <radialGradient id="spBronze" cx="14%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#B49A78" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B49A78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spCourt" cx="85%" cy="22%" r="52%">
      <stop offset="0%" stop-color="#CF6E58" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#CF6E58" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B49A78"/>
      <stop offset="60%" stop-color="#E59866"/>
      <stop offset="100%" stop-color="#CF6E58"/>
