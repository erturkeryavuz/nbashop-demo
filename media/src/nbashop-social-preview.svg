    <text x="24" y="38" fill="#F1EDE5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700">Security Hardening &amp; Isolated Tutorial</text>
    <text x="24" y="66" fill="#6EE7B7" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">SQLi · CSRF · XSS · IDOR · Safe Upload · .htaccess 403</text>
