  <rect width="1280" height="640" fill="url(#spCourt)"/>
  <rect width="1280" height="4" fill="url(#spRule)"/>

  <!-- Subtle court geometry -->
  <g fill="none" stroke="#F1EDE5" stroke-opacity="0.035" stroke-width="2">
