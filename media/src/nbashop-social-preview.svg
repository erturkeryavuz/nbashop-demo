    <text x="2" y="52" fill="#E4DFD5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="25" font-weight="600">Basketball Storefront &amp; Security Audit</text>
